<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Typing Master account to track your progress and compete with others">
    <title>Register - Typing Master</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%);
            padding: 20px;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: float 8s ease-in-out infinite;
        }

        .circle1 {
            width: 400px;
            height: 400px;
            background: rgba(56, 189, 248, 0.2);
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle2 {
            width: 350px;
            height: 350px;
            background: rgba(14, 165, 233, 0.15);
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        .circle3 {
            width: 250px;
            height: 250px;
            background: rgba(37, 99, 235, 0.15);
            top: 50%;
            left: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(30px, -30px) scale(1.05);
            }
            50% {
                transform: translate(-20px, 20px) scale(0.95);
            }
            75% {
                transform: translate(20px, 30px) scale(1.02);
            }
        }

        /* Floating Keyboard Keys */
        .floating-keys {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .key {
            position: absolute;
            font-size: 24px;
            color: rgba(56, 189, 248, 0.1);
            animation: floatKey 15s linear infinite;
        }

        .key:nth-child(1) { left: 10%; animation-delay: 0s; }
        .key:nth-child(2) { left: 25%; animation-delay: 3s; }
        .key:nth-child(3) { left: 40%; animation-delay: 6s; }
        .key:nth-child(4) { left: 55%; animation-delay: 9s; }
        .key:nth-child(5) { left: 70%; animation-delay: 12s; }
        .key:nth-child(6) { left: 85%; animation-delay: 2s; }
        .key:nth-child(7) { left: 95%; animation-delay: 5s; }

        @keyframes floatKey {
            0% {
                top: 110%;
                opacity: 0;
                transform: rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: -10%;
                opacity: 0;
                transform: rotate(360deg);
            }
        }

        /* Register Container */
        .register-container {
            width: 100%;
            max-width: 480px;
            z-index: 10;
        }

        .register-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(56, 189, 248, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #38bdf8;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .logo-icon {
            font-size: 48px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* Form Styles */
        .register-form {
            text-align: left;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 18px 16px 50px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.8);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 1);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .input-wrapper input:focus ~ .icon {
            color: #38bdf8;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #38bdf8;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
        }

        .strength-weak { width: 33%; background: #ef4444; }
        .strength-medium { width: 66%; background: #f59e0b; }
        .strength-strong { width: 100%; background: #22c55e; }

        /* Terms Checkbox */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
        }

        .terms-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #38bdf8;
            cursor: pointer;
            margin-top: 2px;
        }

        .terms-group label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            line-height: 1.5;
        }

        .terms-group a {
            color: #38bdf8;
            text-decoration: none;
        }

        .terms-group a:hover {
            text-decoration: underline;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .register-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 10px 30px rgba(56, 189, 248, 0.4),
                0 0 40px rgba(56, 189, 248, 0.3);
        }

        .register-btn:hover::before {
            left: 100%;
        }

        .register-btn:active {
            transform: translateY(-1px);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        /* Social Register */
        .social-register {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.5);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }

        /* Login Link */
        .login-link {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .login-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .login-link a:hover {
            color: #7dd3fc;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* Features */
        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .feature-icon {
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .register-box {
                padding: 35px 25px;
            }

            .logo {
                font-size: 28px;
            }

            .logo-icon {
                font-size: 36px;
            }

            .social-register {
                flex-direction: column;
            }

            .features {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
        }

        /* Loading State */
        .register-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .register-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Success Animation */
        .success-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .success-animation.show {
            display: flex;
        }

        .success-content {
            text-align: center;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-text {
            color: white;
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-circle circle1"></div>
        <div class="bg-circle circle2"></div>
        <div class="bg-circle circle3"></div>
    </div>

    <!-- Floating Keys -->
    <div class="floating-keys">
        <span class="key">A</span>
        <span class="key">S</span>
        <span class="key">D</span>
        <span class="key">F</span>
        <span class="key">J</span>
        <span class="key">K</span>
        <span class="key">L</span>
    </div>

    <!-- Register Container -->
    <div class="register-container">
        <div class="register-box">
            
            <!-- Logo -->
            <div class="logo">
                <span class="logo-icon">⌨️</span>
                <span>Typing Master</span>
            </div>
            <p class="tagline">Start your typing journey today</p>

            <!-- Register Form -->
            <form class="register-form" method="POST" id="registerForm">
                
                <!-- Username Input -->
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username"
                            name="username" 
                            placeholder="Choose a username"
                            required
                            autocomplete="username"
                            minlength="3"
                            maxlength="20">
                        <span class="icon">👤</span>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email"
                            name="email" 
                            placeholder="Enter your email"
                            required
                            autocomplete="email">
                        <span class="icon">📧</span>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password"
                            name="password" 
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                            minlength="6">
                        <span class="icon">🔒</span>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                    
                    <!-- Password Strength Indicator -->
                    <div class="password-strength" id="passwordStrength" style="display: none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text">
                            <span>Password Strength:</span>
                            <span id="strengthLabel">Weak</span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword"
                            name="confirm_password" 
                            placeholder="Confirm your password"
                            required
                            autocomplete="new-password">
                        <span class="icon">🔐</span>
                    </div>
                </div>

                <!-- Error Message -->
                {% if error %}
                <div class="error-message">
                    <span>⚠️</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Terms and Conditions -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
                    </label>
                </div>

                <!-- Register Button -->
                <button class="register-btn" type="submit" id="registerBtn">
                    Create Account
                </button>

            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <!-- Social Register -->
            <div class="social-register">
                <button type="button" class="social-btn" title="Sign up with Google">
                    🔵
                </button>
                <button type="button" class="social-btn" title="Sign up with GitHub">
                    ⚫
                </button>
                <button type="button" class="social-btn" title="Sign up with Facebook">
                    🔷
                </button>
            </div>

            <!-- Login Link -->
            <div class="login-link">
                Already have an account? 
                <a href="/login">Sign In</a>
            </div>

            <!-- Features -->
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Track Speed</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span>Improve Accuracy</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🏆</span>
                    <span>Compete</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Success Animation -->
    <div class="success-animation" id="successAnimation">
        <div class="success-content">
            <div class="success-icon">🎉</div>
            <p class="success-text">Account Created!</p>
        </div>
    </div>

    <script>
        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Password Strength Checker
        const passwordStrength = document.getElementById('passwordStrength');
        const strengthFill = document.getElementById('strengthFill');
        const strengthLabel = document.getElementById('strengthLabel');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            if (password.length > 0) {
                passwordStrength.style.display = 'block';
                const strength = calculatePasswordStrength(password);
                
                strengthFill.className = 'strength-fill';
                
                if (strength < 33) {
                    strengthFill.classList.add('strength-weak');
                    strengthLabel.textContent = 'Weak';
                } else if (strength < 66) {
                    strengthFill.classList.add('strength-medium');
                    strengthLabel.textContent = 'Medium';
                } else {
                    strengthFill.classList.add('strength-strong');
                    strengthLabel.textContent = 'Strong';
                }
            } else {
                passwordStrength.style.display = 'none';
            }
        });

        function calculatePasswordStrength(password) {
            let strength = 0;
            
            // Length check
            if (password.length >= 6) strength += 20;
            if (password.length >= 8) strength += 20;
            if (password.length >= 12) strength += 20;
            
            // Character variety
            if (/[a-z]/.test(password)) strength += 10;
            if (/[A-Z]/.test(password)) strength += 10;
            if (/[0-9]/.test(password)) strength += 10;
            if (/[^a-zA-Z0-9]/.test(password)) strength += 10;
            
            return Math.min(100, strength);
        }

        // Form Validation
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const confirmPassword = document.getElementById('confirmPassword');

        registerForm.addEventListener('submit', function(e) {
            const password = passwordInput.value;
            const confirm = confirmPassword.value;
            const terms = document.getElementById('terms').checked;

            // Check password match
            if (password !== confirm) {
                e.preventDefault();
                alert('Passwords do not match!');
                confirmPassword.focus();
                return;
            }

            // Check terms
            if (!terms) {
                e.preventDefault();
                alert('Please accept the Terms of Service and Privacy Policy');
                return;
            }

            // Show loading state
            registerBtn.classList.add('loading');
            registerBtn.textContent = 'Creating Account...';
        });

        // Real-time password match check
        confirmPassword.addEventListener('input', function() {
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            }
        });

        // Input Focus Animation
        const inputs = document.querySelectorAll('.input-wrapper input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>

</body>
</html>
