<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Typing Master</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at top left,
    rgba(56,189,248,0.25),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(14,165,233,0.20),
    transparent 40%),

    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827,
        #1e293b
    );
}

/* Background Glow */
.bg-circle{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    z-index:-1;
}

.circle1{
    width:350px;
    height:350px;
    background:#38bdf8;
    top:-100px;
    left:-100px;
    opacity:0.15;
}

.circle2{
    width:300px;
    height:300px;
    background:#0ea5e9;
    bottom:-80px;
    right:-80px;
    opacity:0.15;
}

.circle3{
    width:220px;
    height:220px;
    background:#2563eb;
    top:50%;
    left:10%;
    opacity:0.12;
}

.login-box{
    width:520px;

    background:rgba(15,23,42,0.80);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.08);

    padding:50px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.4),
    0 0 40px rgba(56,189,248,0.2);
}

/* Logo */
.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;

    color:#38bdf8;

    font-size:48px;
    font-weight:bold;

    margin-bottom:35px;

    text-shadow:
    0 0 15px rgba(56,189,248,0.4);
}

.logo span{
    font-size:48px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:18px;

    border:none;
    outline:none;

    border-radius:14px;

    background:#1e293b;

    color:white;

    font-size:18px;
}

.error{
    color:#ff4d4d;
    margin-bottom:15px;
    font-weight:bold;
}

.login-btn{
    width:100%;
    padding:18px;

    border:none;
    border-radius:14px;

    background:linear-gradient(
        90deg,
        #38bdf8,
        #0ea5e9
    );

    color:white;
    font-size:20px;
    font-weight:bold;

    cursor:pointer;
    margin-top:10px;

    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 0 25px rgba(56,189,248,0.5);
}

.register-link{
    margin-top:25px;
    color:white;
    font-size:18px;
}

.register-link a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div class="login-box">

    <div class="logo">
        ⌨️ <span>Typing Master</span>
    </div>

    <form method="POST">

        <div class="input-box">
            <input
                type="text"
                name="username"
                placeholder="Username"
                required>
        </div>

        <div class="input-box">
            <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>
